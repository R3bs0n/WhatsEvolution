{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">{{ title }}</h5>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Nome do segmento *</label>
            <input type="text" name="nome" class="form-control" required placeholder="Ex: Pacientes SUS - Junho 2026">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Descrição</label>
            <textarea name="descricao" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Contatos ({{ contatos|length }} disponíveis)</label>
            <p class="text-muted small mb-2">Selecione os contatos que farão parte deste segmento:</p>
            <div class="border rounded p-2" style="max-height:300px;overflow-y:auto;">
              {% for c in contatos %}
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="contatos" value="{{ c.pk }}" id="c_{{ c.pk }}">
                <label class="form-check-label" for="c_{{ c.pk }}">
                  {{ c.nome }} <span class="text-muted small">({{ c.telefone }})</span>
                </label>
              </div>
              {% empty %}
              <p class="text-muted small mb-0">Nenhum contato ativo. <a href="{% url 'campanha-contato-import' %}">Importe um CSV</a> primeiro.</p>
              {% endfor %}
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar segmento</button>
            <a href="{% url 'campanha-segmento-list' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
