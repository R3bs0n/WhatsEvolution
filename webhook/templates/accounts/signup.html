<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — Saúde Popular</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a6e1a 0%, #0d4a0d 100%); min-height: 100vh; }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.25); }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center py-4">
<div class="container" style="max-width:480px">
  <div class="card p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-person-plus-fill text-success" style="font-size:2rem"></i>
      <h5 class="mt-2 fw-bold">Criar Conta</h5>
    </div>

    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label small fw-semibold">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
            <div class="text-danger small mt-1">{{ error }}</div>
          {% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-success w-100 fw-semibold">
        <i class="bi bi-check-circle me-2"></i>Criar Conta
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'login' %}" class="text-muted small">Já tenho conta</a>
    </div>
  </div>
</div>
</body>
</html>
