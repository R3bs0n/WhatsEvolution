{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">{{ title }}</h5>
        <a href="{% url 'empresa-list' %}" class="btn btn-sm btn-outline-light">
          <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
      </div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Nome da empresa *</label>
            <input type="text" name="nome" class="form-control"
                   value="{{ values.nome|default:'' }}" required
                   placeholder="Ex: Clínica São Lucas">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Segmento</label>
            <input type="text" name="segmento" class="form-control"
                   value="{{ values.segmento|default:'' }}"
                   placeholder="Ex: saude, odontologia, estetica">
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Cor primária</label>
              <div class="input-group">
                <input type="color" name="cor_primaria"
                       value="{{ values.cor_primaria|default:'#0d6efd' }}"
                       class="form-control form-control-color">
                <input type="text" id="cor_primaria_hex"
                       value="{{ values.cor_primaria|default:'#0d6efd' }}"
                       class="form-control form-control-sm font-monospace"
                       maxlength="7" readonly>
              </div>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Cor secundária</label>
              <div class="input-group">
                <input type="color" name="cor_secundaria"
                       value="{{ values.cor_secundaria|default:'#6c757d' }}"
                       class="form-control form-control-color">
                <input type="text" id="cor_secundaria_hex"
                       value="{{ values.cor_secundaria|default:'#6c757d' }}"
                       class="form-control form-control-sm font-monospace"
                       maxlength="7" readonly>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Tema</label>
            <select name="tema" class="form-select">
              <option value="light" {% if values.tema == "light" or not values.tema %}selected{% endif %}>Claro</option>
              <option value="dark" {% if values.tema == "dark" %}selected{% endif %}>Escuro</option>
            </select>
          </div>

          <div class="mb-4">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" name="ativo" id="ativo"
                     {% if values.ativo != False %}checked{% endif %}>
              <label class="form-check-label fw-semibold" for="ativo">Empresa ativa</label>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-1"></i>Salvar empresa
            </button>
            <a href="{% url 'empresa-list' %}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // Sincroniza o campo de texto com o color picker
  document.querySelectorAll('input[type="color"]').forEach(function(picker) {
    const hex = document.getElementById(picker.name + '_hex');
    picker.addEventListener('input', function() {
      if (hex) hex.value = this.value;
    });
  });
</script>
{% endblock %}
