<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Saúde Popular</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a6e1a 0%, #0d4a0d 100%); min-height: 100vh; }
    .login-card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.25); }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container" style="max-width:420px">
  <div class="card login-card p-4 p-md-5">
    <div class="text-center mb-4">
      <i class="bi bi-hospital-fill text-success" style="font-size:2.5rem"></i>
      <h4 class="mt-2 fw-bold">Clínica Médica Saúde Popular</h4>
      <p class="text-muted small">Sistema de Disparo WhatsApp</p>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger py-2">Usuário ou senha inválidos.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Usuário</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Senha</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-success w-100 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
      </button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'signup' %}" class="text-muted small">Criar conta</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
