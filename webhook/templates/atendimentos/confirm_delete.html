{% extends "base.html" %}
{% block title %}Excluir Atendimento{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-danger">
      <div class="card-body text-center py-5">
        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem"></i>
        <h5 class="mt-3">Confirmar Exclusão</h5>
        <p class="text-muted">
          Deseja excluir o atendimento de <strong>{{ object.paciente }}</strong>?<br>
          Esta ação não pode ser desfeita.
        </p>
        <form method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger me-2">
            <i class="bi bi-trash me-1"></i>Sim, excluir
          </button>
          <a href="{% url 'atendimento-detail' object.pk %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
