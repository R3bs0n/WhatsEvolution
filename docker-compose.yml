services:
  evolution-api:
    build:
      context: .
      dockerfile: Dockerfile.evolution
    image: evolution-api-custom:baileys-6.7.23-wa-2.3000.1035194821
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://webhook:8000/webhook/token/${EVOLUTION_WEBHOOK_SECRET}/
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - CHATWOOT_ENABLED=${CHATWOOT_ENABLED}
      - CHATWOOT_MESSAGE_READ=${CHATWOOT_MESSAGE_READ}
      - CHATWOOT_MESSAGE_DELETE=${CHATWOOT_MESSAGE_DELETE}
      - CHATWOOT_BOT_CONTACT=${CHATWOOT_BOT_CONTACT}
      - CHATWOOT_IMPORT_DATABASE_CONNECTION_URI=${CHATWOOT_IMPORT_DATABASE_CONNECTION_URI}
      - CHATWOOT_IMPORT_PLACEHOLDER_MEDIA_MESSAGE=${CHATWOOT_IMPORT_PLACEHOLDER_MEDIA_MESSAGE}
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1035194821
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evo-network

  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evo-network

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evo-network

  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    container_name: evolution_webhook
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobrescreve POSTGRES_USER/PASSWORD do env_file para usar app_role (sem BYPASSRLS → RLS ativo)
      - POSTGRES_USER=${APP_ROLE_USER:-app_role}
      - POSTGRES_PASSWORD=${APP_ROLE_PASSWORD}
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evo-network

  # Serviço de migration — usa o superuser (evolution) que tem DDL + BYPASSRLS.
  # Uso: docker compose run --rm migrate
  migrate:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    container_name: evolution_migrate
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      # Migrations precisam de DDL (CREATE TABLE) — usa superuser, não app_role
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - evo-network
    profiles:
      - migrate

  celery-worker:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    container_name: evolution_celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info -Q celery --concurrency=2
    env_file:
      - .env
    environment:
      # Sobrescreve POSTGRES_USER/PASSWORD para usar app_role (sem BYPASSRLS → RLS ativo em tasks)
      - POSTGRES_USER=${APP_ROLE_USER:-app_role}
      - POSTGRES_PASSWORD=${APP_ROLE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evo-network

  chatwoot-postgres:
    image: pgvector/pgvector:pg15
    container_name: chatwoot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot -d chatwoot_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evo-network

  chatwoot-redis:
    image: redis:7-alpine
    container_name: chatwoot_redis
    restart: unless-stopped
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evo-network

  chatwoot:
    image: chatwoot/chatwoot@sha256:09de1952d6261bc2dee9235c52f67e10f67d9f4bf566072aba920ac588aca5c3
    container_name: chatwoot
    restart: unless-stopped
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - FRONTEND_URL=http://localhost:3000
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE}
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=${CHATWOOT_POSTGRES_PASSWORD}
      - REDIS_URL=redis://chatwoot-redis:6379
    volumes:
      - chatwoot_storage:/app/storage
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      - evo-network

  chatwoot-sidekiq:
    image: chatwoot/chatwoot@sha256:09de1952d6261bc2dee9235c52f67e10f67d9f4bf566072aba920ac588aca5c3
    container_name: chatwoot_sidekiq
    restart: unless-stopped
    depends_on:
      chatwoot-postgres:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - FRONTEND_URL=http://localhost:3000
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE}
      - POSTGRES_HOST=chatwoot-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=chatwoot_production
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=${CHATWOOT_POSTGRES_PASSWORD}
      - REDIS_URL=redis://chatwoot-redis:6379
    volumes:
      - chatwoot_storage:/app/storage
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    networks:
      - evo-network

  # ── Typebot ──────────────────────────────────────────────────────────────
  typebot-db:
    image: postgres:16-alpine
    container_name: typebot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: typebot
      POSTGRES_USER: typebot
      POSTGRES_PASSWORD: ${TYPEBOT_POSTGRES_PASSWORD}
    volumes:
      - typebot_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typebot -d typebot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evo-network

  mailhog:
    image: mailhog/mailhog@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - evo-network

  typebot-builder:
    image: baptistearno/typebot-builder@sha256:a67edf944eb64e885a3660d8bbd11102b9d468d31dbf4b7f6170e4cd2ceaa9d3
    container_name: typebot_builder
    restart: unless-stopped
    depends_on:
      typebot-db:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://typebot:${TYPEBOT_POSTGRES_PASSWORD}@typebot-db:5432/typebot
      - NEXTAUTH_URL=http://localhost:3001
      - NEXT_PUBLIC_VIEWER_URL=http://localhost:3002
      - ENCRYPTION_SECRET=${TYPEBOT_ENCRYPTION_SECRET}
      - NEXTAUTH_SECRET=${TYPEBOT_NEXTAUTH_SECRET}
      - DISABLE_SIGNUP=false
      - ADMIN_EMAIL=washingtoncosta2721@gmail.com
      - DEFAULT_WORKSPACE_PLAN=UNLIMITED
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_SECURE=false
      - SMTP_USERNAME=mailhog
      - SMTP_PASSWORD=mailhog
      - SMTP_FROM=typebot@clinica.local
      - NEXT_PUBLIC_SMTP_FROM=typebot@clinica.local
    networks:
      - evo-network

  typebot-viewer:
    image: baptistearno/typebot-viewer@sha256:70f1dd949f2246432650cfda082c01e45089fb129369ceee6632d57b9c5f2b7e
    container_name: typebot_viewer
    restart: unless-stopped
    depends_on:
      typebot-db:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://typebot:${TYPEBOT_POSTGRES_PASSWORD}@typebot-db:5432/typebot
      - NEXTAUTH_URL=http://localhost:3001
      - NEXT_PUBLIC_VIEWER_URL=http://localhost:3002
      - ENCRYPTION_SECRET=${TYPEBOT_ENCRYPTION_SECRET}
      - NEXTAUTH_SECRET=${TYPEBOT_NEXTAUTH_SECRET}
    networks:
      - evo-network

volumes:
  postgres_data:
  redis_data:
  media_data:
  chatwoot_postgres_data:
  chatwoot_redis_data:
  chatwoot_storage:
  typebot_db_data:

networks:
  evo-network:
    driver: bridge
